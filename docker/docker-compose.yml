version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: sacaudit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sacaudit-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      - redis
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-sacaudit-secret-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - SACARF_API_BASE_URL=${SACARF_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - ../.env

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sacaudit-celery-worker
    restart: unless-stopped
    depends_on:
      - redis
      - api
    command: celery -A config worker --loglevel=info
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-sacaudit-secret-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - SACARF_API_BASE_URL=${SACARF_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - ../.env

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sacaudit-celery-beat
    restart: unless-stopped
    depends_on:
      - redis
      - api
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-sacaudit-secret-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - SACARF_API_BASE_URL=${SACARF_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - ../.env

  nginx:
    image: nginx:alpine
    container_name: sacaudit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - grafana
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: sacaudit-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DEFAULT_LOCALE=es
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

volumes:
  redis_data:
  media_volume:
  static_volume:
  grafana_data:
